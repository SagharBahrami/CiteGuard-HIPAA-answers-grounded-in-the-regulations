[project]
name = "citedguard"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.38",
    "chromadb>=0.5",
    "redis>=5.0",
    "rq>=1.16",
    "openai>=1.50",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.5",
    "tenacity>=9.0",
    "rank-bm25>=0.2",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
# Every top-level module that gets imported at runtime must be listed here;
# setuptools will not discover them on its own. tests/test_packaging.py
# fails if this list drifts out of sync with the modules on disk.
py-modules = ["config", "generate", "guardrails", "qa", "retriever", "audit", "usage", "mcp_server", "jobs", "locks", "version_query"]

[tool.setuptools.packages.find]
include = ["ingest*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
