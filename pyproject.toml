[project]
name = "citedguard"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.38",
    "chromadb>=0.5",
    "redis>=5.0",
    "rq>=1.16",
    "openai>=1.50",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.5",
    "tenacity>=9.0",
    "rank-bm25>=0.2",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# src-layout: everything importable lives under src/citedguard/ and is found
# automatically, so there is no hand-maintained module list to drift out of
# sync with the files on disk (which previously shipped worker containers
# missing modules -- see tests/test_packaging.py).
#
# app.py, mcp_server.py and evals/ are deliberately NOT packaged: they are
# entrypoints and a dev harness, launched by path from the source tree, never
# imported by the library.
[tool.setuptools.packages.find]
where = ["src"]
include = ["citedguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
