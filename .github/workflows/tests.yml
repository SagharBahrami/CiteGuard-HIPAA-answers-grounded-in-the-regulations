# Runs the test suite on GitHub's own machines every time code is pushed.
# A red X on a commit means these tests failed; green means they passed.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      # Don't cancel the 3.12 run just because 3.10 failed -- when a failure is
      # version-specific, seeing which versions broke is the useful signal.
      fail-fast: false
      matrix:
        # 3.10 is the minimum pyproject allows, 3.12 is a current release.
        # Testing both catches "works on my machine" version differences.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the project and its test dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        # config.py builds its Settings object at import time, and two fields
        # have no default, so the package cannot even be imported without
        # these set. Locally they come from .env, which is correctly not in
        # git -- so CI has to supply them.
        #
        # The values are deliberately fake. Every test stubs the OpenAI and
        # Redis clients (see tests/conftest.py), so nothing here reaches a
        # real service and no real key is needed. If a test ever starts
        # failing because these aren't real, that test is making a live call
        # it shouldn't be making.
        env:
          OPENAI_API_KEY: test-key-not-a-real-credential
          HIPAA_SOURCE_URL: https://example.invalid/test-only
        # Downloading raw job logs needs admin rights on the repo, so a failure
        # here is otherwise invisible to anyone without them. Re-emitting the
        # tail of pytest's output as a GitHub error annotation puts the actual
        # reason on the run page, where it can be read without those rights.
        run: |
          set +e
          pytest -q 2>&1 | tee pytest-output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(tail -c 4000 pytest-output.txt | sed 's/%/%25/g; s/::/:/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=pytest failed (exit $code)::$msg"
          fi
          exit $code
