services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./chroma_db:/app/chroma_db
    depends_on:
      - redis

  worker:
    build: .
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./chroma_db:/app/chroma_db
    depends_on:
      - redis
    # SimpleWorker (no os.fork) rather than the default Worker: this compose
    # file also has to work for `docker compose run` on a Windows host, where
    # fork() doesn't exist -- see README.
    command: rq worker citedguard --url redis://redis:6379/0 --worker-class rq.SimpleWorker
    deploy:
      replicas: 4
